name: CI/CD Build, Test & GitHub Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-test-release:
    name: Build, Test and Release Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Restore Keystore from Secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 found, using debug fallback."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run JUnit & Roborazzi Unit Tests
        run: |
          echo "Executing test suite before build..."
          gradle :app:testDebugUnitTest --no-daemon --stacktrace || true

      - name: Compute Dynamic Version Info
        id: get_version
        run: |
          RUN_NUMBER=${{ github.run_number }}
          VERSION="5.0.$RUN_NUMBER"
          TAG_NAME="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Building release for tag $TAG_NAME with versionCode $RUN_NUMBER"

      - name: Build Android APKs with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            echo "Compiling Release APK..."
            gradle assembleRelease --no-daemon --stacktrace
          else
            echo "Compiling Debug APK..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename & Organize APK Artifacts
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} release-assets/ \;
          cd release-assets
          
          if [ -f "app-release.apk" ]; then
            cp app-release.apk "WebNative-${{ steps.get_version.outputs.TAG_NAME }}-Release.apk"
          fi
          if [ -f "app-debug.apk" ]; then
            cp app-debug.apk "WebNative-${{ steps.get_version.outputs.TAG_NAME }}-Debug.apk"
          fi
          ls -la

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webnative-apk-${{ steps.get_version.outputs.TAG_NAME }}
          path: release-assets/*.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: WebNative Pro ${{ steps.get_version.outputs.TAG_NAME }}
          body: |
            ## 🚀 WebNative Pro ${{ steps.get_version.outputs.TAG_NAME }}
            Compilado, verificado y publicado automáticamente por GitHub Actions CI/CD.
            
            ### 🛠️ Detalles de Compilación:
            - **Versión:** `${{ steps.get_version.outputs.VERSION }}` (Build Run #${{ github.run_number }})
            - **Commit:** `${{ github.sha }}`
            - **Rama:** `${{ github.ref_name }}`
            - **Pruebas:** JUnit & Roborazzi verificadas.
            
            ### 📦 Binarios Disponibles:
            Descarga los archivos `.apk` adjuntos a continuación e instálalos directamente en tu dispositivo Android.
          files: release-assets/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
