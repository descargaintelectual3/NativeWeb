name: WebNative Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: webnative-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version_manifest.json | head -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' version_manifest.json | head -n 1)"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version"; exit 1; }
          [[ "$version_code" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode: $version_code"; exit 1; }
          (( version_code > 0 )) || { echo "versionCode must be positive"; exit 1; }

          package_version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          package_code="$(sed -n 's/^[[:space:]]*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' package.json | head -n 1)"
          [[ "$package_version" == "$version" ]] || { echo "package.json version does not match version_manifest.json"; exit 1; }
          [[ "$package_code" == "$version_code" ]] || { echo "package.json versionCode does not match version_manifest.json"; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building WebNative v$version (versionCode $version_code)"

      - name: Build Android debug APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Verify APK output
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/app-debug.apk
          cp "$apk" "release-assets/WebNative-${TAG_NAME}.apk"
          sha256sum release-assets/*.apk | tee release-assets/SHA256SUMS.txt
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh release-assets

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webnative-apks-${{ steps.version.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WebNative Pro ${{ steps.version.outputs.tag }}
          body: |
            ## WebNative Pro ${{ steps.version.outputs.tag }}

            Release generada automáticamente por GitHub Actions.

            ### Cambios incluidos
            - Nueva línea de versión 5.x compatible con instalaciones WebNative 4.x.
            - Las 15 rutas de actualización y el acceso GitHub de cero clics permanecen disponibles.
            - Comprobación OTA persistente, notificaciones y descarga automática cuando están activadas.
            - Compilación reproducible con JDK 17, Gradle 8.11.1 y Android SDK 35.

            ### Archivos
            - `app-debug.apk`: APK instalable.
            - `WebNative-${{ steps.version.outputs.tag }}.apk`: APK con nombre versionado.
            - `SHA256SUMS.txt`: hashes SHA-256 de los APK.
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
